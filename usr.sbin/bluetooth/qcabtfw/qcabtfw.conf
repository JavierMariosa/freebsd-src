#
# Download Qualcomm Atheros QCA61x4 (ROME) bluetooth adaptor firmware
#

notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"ATTACH";
	match "vendor"		"0x0cf3";
	match "product"		"(0x535b|0xe007|0xe009|0xe010|0xe300|0xe301|0xe360|0xe500)";
	action "/usr/sbin/qcabtfw -d $cdev -f /usr/local/share/qcabt-firmware";
};
